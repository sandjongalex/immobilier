name: Technical foundation checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: immobilier_ci
          POSTGRES_USER: immobilier_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immobilier_ci -d immobilier_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_DB: immobilier_ci
      POSTGRES_USER: immobilier_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/dev.txt
      - name: Generate ephemeral Django key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: python manage.py check --settings=config.settings.testing
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.testing
      - run: python manage.py spectacular --file /tmp/immobilier-schema.yml --settings=config.settings.testing
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
